<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablo's Bar - Contacto</title>
    <link rel="stylesheet" href="contacto.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="menu.html">Nuestro Menú</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="contact-container">
        <div class="contact-info">
            <h2>¡Ven y Visítanos!</h2>
            <p>Haz tu reserva o consúltanos cualquier duda.</p>
            <ul class="info-list">
                <li> Calle Pricensa, 3, Madrid</li>
                <li> +34 912 345 678</li>
                <li>info@pablosbar.com</li>
            </ul>
        </div>

        <div class="contact-form">
            <h3>Reserva tu Mesa</h3>
            <form action="" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>

                <div class="form-group">
                    <label for="comensales">Número de Personas</label>
                    <input type="number" id="comensales" name="comensales" min="1" max="20" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje o Notas Especiales</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Alergias, trona para bebé, etc..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Enviar Reserva</button>
            </form>
        </div>
    </main>

    <footer>
        <p> 2026 Taberna de Pablo. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
